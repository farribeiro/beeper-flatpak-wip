id: com.beeper.Beeper
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: beepertexts
finish-args:
  - --device=dri
  - --filesystem=xdg-download
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-videos:ro
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=wayland
  - --talk-name=org.freedesktop.Notifications
modules:
  - shared-modules/libappindicator/libappindicator-gtk3-12.10.json
  - shared-modules/libsecret/libsecret.json
  - name: beepertexts
    buildsystem: simple
    sources:
      - type: script
        dest-filename: beepertexts
        commands:
          - zypak-wrapper /app/extra/beepertexts/beepertexts "$@"
      - type: extra-data
        only-arches:
          - x86_64
        filename: Beeper.AppImage
      - type: file
        path: com.beeper.Beeper.metainfo.xml
      - type: file
        path: icons/com.beeper.Beeper.png
      - type: file
        path: com.beeper.Beeper.desktop
      - type: script
        dest_filename: apply_extra.sh
        commands:
          - chmod +x Beeper.AppImage
          - Beeper.AppImage --appimage-extract
          - mv squashfs-root/* .
          - rm -rf Beeper.AppImage squashfs-root
    build-commands:
      - install -Dm755 apply_extra.sh ${FLATPAK_DEST}/bin/apply_extra
      - install -Dm644 ${FLATPAK_ID}.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo/
      - install -Dm644 ${FLATPAK_ID}.png -t ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps
      - install -Dm755 beepertexts -t ${FLATPAK_DEST}/bin
      - ln -s ${FLATPAK_DEST}/bin/beepertexts ${FLATPAK_DEST}/bin/beeper
