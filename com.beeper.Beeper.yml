id: com.beeper.Beeper
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
rename-icon: beepertexts
rename-desktop: beepertexts
command: beeper
finish-args:
  - --device=dri
  - --filesystem=xdg-download
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-videos:ro
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=wayland
  - --talk-name=org.freedesktop.Notifications
modules:
  - shared-modules/libappindicator/libappindicator-gtk3-12.10.json
  - shared-modules/libsecret/libsecret.json
  - name: beepertexts
    buildsystem: simple
    sources:
      - type: file
        path: Beeper.AppImage
      - type: file
        path: com.beeper.Beeper.metainfo.xml
      - type: script
        dest-filename: beeper
        commands:
          - zypak-wrapper /app/extra/beepertexts/beepertexts "$@"
    build-commands:
      - chmod +x Beeper.AppImage
      - ./Beeper.AppImage --appimage-extract
      - ls
      - desktop-file-edit --set-icon ${FLATPAK_ID} --set-key Exec --set-value 'beeper
              %u' squashfs-root/beepertexts.desktop
      - cp -a squashfs-root/* ${FLATPAK_DEST}/
      - mkdir -p ${FLATPAK_DEST}/share/icons/hicolor
      #- cp -r squashfs-root/usr/share/icons/hicolor/* ${FLATPAK_DEST}/share/icons/hicolor
      - rm -rf Beeper.AppImage squashfs-root
      - install -Dm644 squashfs-root/beepertexts.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dm644 squashfs-root/${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo/
      - install -Dm644 squashfs-root/beepertexts.png -t ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps
      - install -Dm755 beepertexts -t ${FLATPAK_DEST}/bin
      - ln -s ${FLATPAK_DEST}/bin/beepertexts ${FLATPAK_DEST}/bin/beeper
